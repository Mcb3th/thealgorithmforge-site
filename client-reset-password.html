<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Reset Password | The Algorithm Forge
  </title>

  <meta
    name="robots"
    content="noindex, nofollow"
  />

  <link
    rel="icon"
    type="image/png"
    href="assets/images/af-logo.png"
  />

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="css/client-login.css"
  />

</head>


<body>

  <main class="login-page">

    <header class="login-brand">

      <a
        href="index.html"
        class="brand-link"
        aria-label="The Algorithm Forge home"
      >

        <img
          src="assets/images/af-logo.png"
          alt=""
          class="brand-logo"
        />

        <div class="brand-wordmark">

          <span class="brand-the">
            THE
          </span>

          <span class="brand-name">
            <span class="brand-accent">A</span>LGORITHM
            <span class="brand-accent">F</span>ORGE
          </span>

        </div>

      </a>

    </header>


    <section class="login-shell">

      <div class="login-card">

        <div class="login-heading">

          <p class="eyebrow">
            ACCOUNT RECOVERY
          </p>

          <h1>
            RESET YOUR
            <span>PASSWORD.</span>
          </h1>

          <p class="login-intro">
            Choose a new password for your
            Algorithm Forge client portal account.
          </p>

        </div>


        <form
          class="login-form"
          id="resetPasswordForm"
          novalidate
        >

          <div class="form-field">

            <label for="newPassword">
              New Password
            </label>

            <div class="password-field">

              <input
                type="password"
                id="newPassword"
                name="new_password"
                autocomplete="new-password"
                minlength="8"
                required
              />

              <button
                type="button"
                class="password-toggle"
                id="newPasswordToggle"
                aria-label="Show password"
              >
                Show
              </button>

            </div>

          </div>


          <div class="form-field">

            <label for="confirmPassword">
              Confirm New Password
            </label>

            <div class="password-field">

              <input
                type="password"
                id="confirmPassword"
                name="confirm_password"
                autocomplete="new-password"
                minlength="8"
                required
              />

              <button
                type="button"
                class="password-toggle"
                id="confirmPasswordToggle"
                aria-label="Show password"
              >
                Show
              </button>

            </div>

          </div>


          <div
            class="login-error"
            id="resetPasswordMessage"
            role="alert"
            aria-live="polite"
            hidden
          ></div>


          <button
            type="submit"
            class="login-button"
            id="resetPasswordButton"
          >

            <span id="resetPasswordButtonText">
              Update Password
            </span>

            <span
              class="button-loader"
              id="resetPasswordLoader"
              aria-hidden="true"
              hidden
            ></span>

          </button>

        </form>


        <div class="login-help">

          <p>
            Remembered your password?
          </p>

          <a href="client-login.html">
            Return to Client Login
          </a>

        </div>

      </div>

    </section>


    <footer class="login-footer">

      <span>
        © 2026 The Algorithm Forge
      </span>

      <span aria-hidden="true">
        •
      </span>

      <a href="index.html">
        thealgorithmforge.com
      </a>

    </footer>

  </main>


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="js/client-reset-password.js"></script>

</body>

</html>
